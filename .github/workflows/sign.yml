# Every change to directory.json is checked, then signed with the directory's
# key (the DIRECTORY_SIGNING_KEY secret) and the signature committed beside it.
name: Sign
on:
  push:
    branches: [main]
    paths: [directory.json]
  pull_request:
    paths: [directory.json]

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: bin/check
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name == 'push'
        run: bin/sign
        env:
          DIRECTORY_SIGNING_KEY: ${{ secrets.DIRECTORY_SIGNING_KEY }}
      - if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add directory.json.sig
          git diff --cached --quiet || git commit -m "Sign directory.json" && git push
